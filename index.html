<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nina Bot – Your launch tech, sorted</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #f9f8f6;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 0;
  }

  .chat-wrapper {
    width: 100%;
    max-width: 680px;
    height: 100vh;
    background: #fff;
    border-radius: 0;
    border: 1px solid #f6c4c7;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 32px rgba(232, 48, 79, 0.08);
  }

  .header {
    background: #e8304f;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .header-text .name {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.01em;
  }

  .header-text .tagline {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    margin-top: 2px;
    font-style: italic;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #85d0cd;
    margin-left: auto;
    flex-shrink: 0;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    margin-left: 12px;
  }

  .header-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 100px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    letter-spacing: 0.03em;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .header-btn:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }

  .header-btn.saved {
    background: rgba(133,208,205,0.3);
    border-color: #85d0cd;
    color: #fff;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: #f6c4c7; border-radius: 2px; }

  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg-row.user { align-items: flex-end; }
  .msg-row.bot  { align-items: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.75;
    border-radius: 4px 18px 18px 18px;
  }

  .bubble.bot {
    background: #fdf0f1;
    border: 1px solid #f6c4c7;
    color: #1a1a2e;
    border-radius: 4px 18px 18px 18px;
  }

  .bubble.user {
    background: #e8304f;
    color: #fff;
    border-radius: 18px 18px 4px 18px;
  }

  .bubble ul {
    padding-left: 18px;
    margin: 6px 0;
    list-style-type: disc;
  }

  .bubble ul li { margin-bottom: 5px; }

  .bubble strong {
    font-weight: 600;
    color: #e8304f;
  }

  .bubble.user strong { color: #fff; }

  .quick-replies {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .qr-btn {
    padding: 8px 18px;
    font-size: 13px;
    font-family: 'Montserrat', sans-serif;
    border: 1.5px solid #85d0cd;
    border-radius: 100px;
    background: #fff;
    color: #e8304f;
    cursor: pointer;
    transition: all 0.15s;
  }

  .qr-btn:hover {
    background: #85d0cd;
    color: #fff;
    border-color: #85d0cd;
  }

  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 16px;
    background: #fdf0f1;
    border: 1px solid #f6c4c7;
    border-radius: 4px 18px 18px 18px;
    width: fit-content;
  }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #85d0cd;
    animation: bounce 1.2s ease infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    padding: 14px 16px;
    border-top: 1px solid #f6c4c7;
    background: #fff;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    resize: none;
    font-size: 14px;
    font-family: 'Montserrat', sans-serif;
    padding: 10px 14px;
    border: 1.5px solid #f6c4c7;
    border-radius: 20px;
    outline: none;
    line-height: 1.5;
    min-height: 42px;
    max-height: 120px;
    background: #f9f8f6;
    color: #1a1a2e;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: #85d0cd; }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #e8304f;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .send-btn:hover { background: #85d0cd; }
  .send-btn:disabled { background: #f6c4c7; cursor: not-allowed; }

  .voice-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1.5px solid #f6c4c7;
    background: #fff;
    color: #e8304f;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .voice-btn:hover { border-color: #85d0cd; color: #85d0cd; }

  .voice-btn.listening {
    background: #e8304f;
    border-color: #e8304f;
    color: #fff;
    animation: pulse 1s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,48,79,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(232,48,79,0); }
  }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2e;
    color: #fff;
    font-size: 12px;
    font-family: 'Montserrat', sans-serif;
    padding: 8px 16px;
    border-radius: 100px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show { opacity: 1; }

  .notice {
    text-align: center;
    padding: 8px 16px;
    font-size: 11px;
    color: #b0a99a;
    letter-spacing: 0.02em;
    line-height: 1.7;
    border-top: 1px solid #f6c4c7;
  }

  .footer {
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: #b0a99a;
    letter-spacing: 0.05em;
    border-top: 1px solid #f6c4c7;
  }

  @media (max-width: 480px) {
    body { padding: 0; align-items: flex-end; }
    .chat-wrapper { border-radius: 16px 16px 0 0; height: 95vh; max-height: none; }
  }
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="header">
    <div class="header-avatar">
      <svg width="22" height="20" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 18.5C11 18.5 1.5 12.5 1.5 6.5C1.5 4.01 3.51 2 6 2C7.99 2 9.68 3.18 10.5 4.87C10.67 5.22 11.33 5.22 11.5 4.87C12.32 3.18 14.01 2 16 2C18.49 2 20.5 4.01 20.5 6.5C20.5 12.5 11 18.5 11 18.5Z" fill="#f6c4c7"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="name">Nina Bot</div>
      <div class="tagline">Your launch tech, sorted</div>
    </div>
    <div class="status-dot"></div>
    <div class="header-actions">
      <button class="header-btn" id="saveBtn" onclick="saveChat()">Save</button>
      <button class="header-btn" onclick="resetChat()">Start again</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea id="input" placeholder="Chat to Nina…" rows="1"></textarea>
    <button class="voice-btn" id="voiceBtn" title="Speak your message">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="send-btn" id="sendBtn" disabled>↑</button>
  </div>

  <div class="notice">
    Your progress saves to this browser only. Return here on the same device to pick up where you left off.<br>
    Prefer to talk? Hit the 🎤 and chat to me by voice note.
  </div>
  <div class="footer">Nina Mistry · your launch tech, sorted</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "ninaBotChat_v1";
  const WELCOME = "Hey! Right, let's get your tech sorted.\n\nTell me what you're working on and we'll make sure everything is set up properly and actually works.";

  let history = [];
  let buttonsUsed = false;
  let loading = false;

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("sendBtn");
  const voiceBtn   = document.getElementById("voiceBtn");
  const saveBtn    = document.getElementById("saveBtn");

  function renderMarkdown(text) {
    const lines = text.split("\n");
    let html = "";
    let inList = false;

    for (let line of lines) {
      const isBullet = /^[-*] /.test(line.trim());
      if (isBullet) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + inlineFormat(line.trim().replace(/^[-*] /, "")) + "</li>";
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (line.trim() === "") {
          html += "<div style='height:6px'></div>";
        } else {
          html += "<div>" + inlineFormat(line) + "</div>";
        }
      }
    }
    if (inList) html += "</ul>";
    return html;
  }

  function inlineFormat(text) {
    return text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  }

  function addMessage(role, text, showButtons = false) {
    const row = document.createElement("div");
    row.className = "msg-row " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;

    if (role === "user") {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = renderMarkdown(text);
    }

    row.appendChild(bubble);

    if (showButtons && !buttonsUsed) {
      const qr = document.createElement("div");
      qr.className = "quick-replies";
      qr.id = "quick-replies";
      ["I'm building from scratch", "Something's broken", "I'm about to go live", "I need to test everything"].forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "qr-btn";
        btn.textContent = opt;
        btn.onclick = () => handleQuickReply(opt);
        qr.appendChild(btn);
      });
      row.appendChild(qr);
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typing-row";
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-row");
    if (t) t.remove();
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function saveChat() {
    if (history.length <= 1) {
      showToast("Nothing to save yet");
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ history, buttonsUsed }));
      saveBtn.classList.add("saved");
      saveBtn.textContent = "Saved ✓";
      showToast("Progress saved");
      setTimeout(() => {
        saveBtn.classList.remove("saved");
        saveBtn.textContent = "Save";
      }, 2500);
    } catch {
      showToast("Couldn't save — try again");
    }
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      if (!saved.history || saved.history.length <= 1) return false;
      history = saved.history;
      buttonsUsed = saved.buttonsUsed || true;
      history.forEach((msg, i) => {
        const showBtns = i === 0 && !buttonsUsed;
        addMessage(msg.role === "assistant" ? "bot" : "user", msg.content, showBtns);
      });
      showToast("Welcome back — picked up where you left off");
      return true;
    } catch {
      return false;
    }
  }

  async function callBot(userText) {
    if (loading) return;
    loading = true;
    sendBtn.disabled = true;

    history.push({ role: "user", content: userText });
    addTyping();

    try {
      const res = await fetch("/./api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      const reply = data.reply || "Something went wrong — try again";
      removeTyping();
      history.push({ role: "assistant", content: reply });
      addMessage("bot", reply);
    } catch {
      removeTyping();
      addMessage("bot", "Something went wrong — try again");
    }

    loading = false;
    sendBtn.disabled = !inputEl.value.trim();
  }

  function handleQuickReply(choice) {
    if (buttonsUsed) return;
    buttonsUsed = true;
    const qr = document.getElementById("quick-replies");
    if (qr) qr.remove();
    history = [{ role: "assistant", content: WELCOME }];
    addMessage("user", choice);
    callBot(choice);
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text || loading) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;
    addMessage("user", text);
    callBot(text);
  }

  function resetChat() {
    localStorage.removeItem(STORAGE_KEY);
    history = [];
    buttonsUsed = false;
    messagesEl.innerHTML = "";
    history = [{ role: "assistant", content: WELCOME }];
    addMessage("bot", WELCOME, true);
  }

  let recognition = null;
  let isListening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-GB";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      inputEl.value = transcript;
      inputEl.dispatchEvent(new Event("input"));
    };

    recognition.onend = () => {
      isListening = false;
      voiceBtn.classList.remove("listening");
    };

    recognition.onerror = () => {
      isListening = false;
      voiceBtn.classList.remove("listening");
      showToast("Couldn't catch that — try again");
    };

    voiceBtn.addEventListener("click", () => {
      if (isListening) {
        recognition.stop();
      } else {
        isListening = true;
        voiceBtn.classList.add("listening");
        recognition.start();
      }
    });
  } else {
    voiceBtn.style.display = "none";
  }

  inputEl.addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
    sendBtn.disabled = !this.value.trim() || loading;
  });

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener("click", send);

  const restored = loadSaved();
  if (!restored) {
    history = [{ role: "assistant", content: WELCOME }];
    addMessage("bot", WELCOME, true);
  }
</script>
</body>
</html>
